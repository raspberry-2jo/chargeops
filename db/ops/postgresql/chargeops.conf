# /var/lib/pgsql/17/data/conf.d/chargeops.conf  (postgresql.conf 맨 끝에 include_dir = 'conf.d')
#   기본 postgresql.conf 는 그대로 두고 바꾼 값만 이 파일에 → 무엇을 바꿨는지 한눈에, 업그레이드 때 비교 쉬움
#   메모리 값은 DB VM 메모리 4GB 기준. 8GB 면 괄호 안 값으로 (VM 사양은 인프라 팀 2.4 기준으로 맞춤)
#   놓는 법 · 순서: docs/setup/postgres-replication.md   · shared_preload_libraries 의 확장 3개는 패키지가 먼저 깔려 있어야 함
#   archive_command 는 pgBackRest(WBS 2.8, db/ops/pgbackrest) 설정과 함께 켠다 — 저장소가 없으면 WAL 이 pg_wal 에 쌓임
listen_addresses = '*'                # 실습망에서 받기 (누가 들어올지는 pg_hba.conf 와 firewalld 가 정한다)
port = 5432
max_connections = 100                 # 앱은 PgBouncer 가 수십 개로 묶어 준다 (충전기 1,000대 ≠ 연결 1,000개)
shared_buffers = 1GB                  # 메모리의 약 1/4  (spec: 2GB)
effective_cache_size = 3GB            # OS 캐시 포함 "쓸 수 있는 캐시" 어림 — 실행 계획 판단용  (spec: 6GB)
work_mem = 16MB                       # 정렬 · 해시 하나당. 적재 함수는 함수 안에서 64MB 로 따로 올린다
maintenance_work_mem = 256MB          # 인덱스 생성 · VACUUM
max_wal_size = 2GB                    # 전국 기본정보(52만 행) 적재 때 체크포인트가 너무 잦지 않게
min_wal_size = 256MB

# ── 복제 · PITR 의 기반: WAL ──
wal_level = replica                   # Standby 복제 + 아카이브에 필요한 정보
max_wal_senders = 5
max_replication_slots = 5
max_slot_wal_keep_size = 4GB         # Standby 가 오래 꺼져도 복제 슬롯이 WAL 을 무한정 붙잡지 않게 (디스크 보호)
wal_keep_size = 512MB
hot_standby = on                      # Standby 에서 조회 허용 (report_ro · app_reader)
wal_log_hints = on                    # pg_rewind(장애 뒤 구 Primary 재편입) 조건 (데이터 체크섬을 켰다면 없어도 됨)
archive_mode = on
archive_command = 'pgbackrest --stanza=chargeops archive-push %p'
archive_timeout = 60                  # 최대 60초마다 WAL 강제 전환 → 복구 시점 목표(RPO) 1분

# ── 확장 · 감사 · 성능 분석 ──
shared_preload_libraries = 'pg_stat_statements,pg_cron,pgaudit'
cron.database_name = 'chargeops'      # pg_cron 작업이 도는 DB
cron.timezone = 'Asia/Seoul'          # 일정(예: 매일 00:20)을 한국 시간으로 (기본은 GMT)
cron.use_background_workers = on      # 작업을 서버 안의 작업자로 실행. 기본(off)은 작업마다 localhost(127.0.0.1)로 새로 접속하는데
                                      #   pg_hba 의 127.0.0.1 줄이 비밀번호(scram)를 요구해 모든 작업이 'connection failed' (2026-10-11 실제 PC)
pgaudit.log = 'ddl, role'             # 스키마 변경 · 권한 변경을 감사 로그로
pg_stat_statements.track = all
track_io_timing = on

# ── 로그 · 보안 · 시간 ──
log_min_duration_statement = 500      # 0.5초 넘는 쿼리 기록 (튜닝 대상)
log_line_prefix = '%m [%p] %u@%d %a '
log_lock_waits = on
password_encryption = scram-sha-256
timezone = 'Asia/Seoul'
