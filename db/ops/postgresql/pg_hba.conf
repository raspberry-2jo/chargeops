# /var/lib/pgsql/17/data/pg_hba.conf — "누가 · 어디서 · 어느 DB 에 · 어떤 방식으로" (위에서부터 처음 맞는 줄 하나만 적용)
#   Standby(db-02)는 pg_basebackup 으로 이 파일까지 복사해 가므로 두 서버에 같은 규칙이 적용된다
#   주소는 아키텍처의 망 설계(DB망 10.10.30.0/24 · 관리망 10.10.40.0/24) 기준. WBS 1.3 IP 대역표가 바뀌면 아래 주소만 맞춘다
#   10.10.0.1/32 = 실습 PC 한 대 구성에서 관리자 PC(VirtualBox 호스트). 실습 LAN 여러 대로 나누면 관리자 PC 주소로 바꾼다
# TYPE  DATABASE           USER                              ADDRESS            METHOD
local   all                postgres                                             peer
local   all                all                                                  scram-sha-256
# Patroni(Replica)가 자기 서버의 timeline 을 소켓 복제 연결로 확인 (patroni.yml use_unix_socket_repl) — 'all' 은 replication 을 포함하지 않아 따로 적는다
local   replication        replicator                                           scram-sha-256
host    all                all                               127.0.0.1/32       scram-sha-256
# PgBouncer(db-01 · db-02 에 하나씩) 경유 앱 계정 — 쓰기 풀은 자기 서버(위의 127.0.0.1 줄), 아래는 db-01 의 읽기 풀 → db-02
host    chargeops          app_writer,app_reader,report_ro   10.10.30.11/32     scram-sha-256
# 복제 · pg_rewind: DB 서버끼리만
host    replication        replicator                        10.10.30.0/24      scram-sha-256
host    chargeops,postgres postgres                          10.10.30.0/24      scram-sha-256
# dba: 관리망과 관리자 PC(Windows 호스트 — DBeaver)에서만
host    all                dba                               10.10.40.0/24      scram-sha-256
host    all                dba                               10.10.0.1/32       scram-sha-256
# 모니터링 (같은 서버의 exporter)
host    postgres,chargeops postgres_exporter                 127.0.0.1/32       scram-sha-256
# AI 게이트웨이 · RAG (인프라 D 환경 → VirtualBox NAT 로 Windows 호스트 주소로 보임). 5432 직접 · SSL 접속만 (db/ops/ai, 2026-10-22)
hostssl litellm            litellm                           10.10.0.1/32       scram-sha-256
hostssl ragdb              rag_indexer,rag_reader            10.10.0.1/32       scram-sha-256
# 위에 없는 접속은 모두 거부 (명시)
host    all                all                               0.0.0.0/0          reject
