; /etc/pgbouncer/pgbouncer.ini — 연결 풀러 (:6432, db-01 · db-02 에 하나씩). 주석은 줄 맨 앞에만 (값 뒤에 붙이면 값으로 읽힘)
; 설치: 각 DB 서버에서  sudo bash db/ops/pgbouncer/install-pgbouncer.sh  (Standby 서버에서는 chargeops_ro 를 127.0.0.1 로 바꿔 깐다)
; 앱은 "host=db-01,db-02 port=6432 … target_session_attrs=read-write" 로 접속 → 두 문 중 Primary 쪽을 스스로 고른다
[databases]
; 쓰기 풀 → 자기 서버의 PostgreSQL. 장애 전환 때 이 파일을 고치지 않는다 (역할이 바뀐 서버는 restart — reload 로는
; 1.26 이 서버의 '읽기 전용' 상태 기억을 지우지 않아 앱이 두 문 모두에서 거절당함, 실제 PC 2026-10-12)
chargeops    = host=127.0.0.1 port=5432 dbname=chargeops
; 읽기 풀(report_ro · Grafana) → Standby(db-02). db-02 의 설정에서는 127.0.0.1
chargeops_ro = host=db-02 port=5432 dbname=chargeops

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
; PostgreSQL 의 SCRAM 비밀(평문 아님)을 그대로 복사한 파일 — make-userlist.sh 가 만듦 (.gitignore 로 커밋 안 됨)
auth_file = /etc/pgbouncer/userlist.txt
; 트랜잭션 단위로 서버 연결을 빌려줌 → 클라이언트 1,000 / 서버 연결 수십
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
reserve_pool_size = 5
; 트랜잭션 모드에서도 프로토콜 수준 prepared statement 지원 (1.21+)
max_prepared_statements = 100
; DBeaver(JDBC) 등이 보내는 시작 매개변수를 무시 (모르면 접속 거부됨)
ignore_startup_parameters = extra_float_digits,options
server_reset_query = DISCARD ALL
admin_users = postgres
stats_users = postgres_exporter
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
